services:
  - type: web
    name: hatgaosky-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma db push && npx ts-node prisma/seed.ts
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: hatgaosky-super-secret-jwt-key-airline-2026
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_SECRET
        value: hatgaosky-refresh-jwt-key-airline-2026
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SEAT_HOLD_TTL_MINUTES
        value: "15"
      - key: PAYMENT_HOLD_MINUTES
        value: "30"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_FROM
        value: "Hạt Gạo Sky <fukk223345@gmail.com>"
      - key: BREVO_API_KEY
        sync: false

